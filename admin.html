<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Painel — FF ESTORE</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,600;0,800;1,800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.k{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}.k b{font:800 26px "Exo 2";display:block}.k span{color:var(--mut);font-size:13px}
.box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0}.box h3{margin:0 0 12px}label{display:block;color:var(--mut);font-size:13px;margin:10px 0 6px}
select.f,textarea.f{height:auto;padding:14px;font-size:16px}textarea.f{min-height:90px;font-weight:400}.tabs{display:flex;gap:8px;overflow:auto;margin:10px 0}.tabs button{padding:8px 14px;border-radius:99px;background:#15110f;border:1px solid var(--line);white-space:nowrap}.tabs .on{background:var(--red);border-color:var(--red)}
.o{display:flex;justify-content:space-between;gap:8px;padding:12px 0;border-top:1px solid #1b1b22;cursor:pointer;font-size:14px}.o small{color:var(--mut);display:block}pre{white-space:pre-wrap;word-break:break-all;font-size:12px;color:var(--mut);background:#0b0b0f;padding:10px;border-radius:12px}.warn{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:#fbbf24;border-radius:14px;padding:12px;font-size:14px;margin:12px 0}.row2{display:flex;gap:8px}.row2 .btn{margin:0}</style></head>
<body><main class="wrap" style="padding-bottom:60px"><h1 style="font-size:30px;margin:26px 0 4px">Painel FF ESTORE</h1><div id="app"></div></main><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),brl=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2500)};
async function api(u,m,b){const r=await fetch(u,{method:m||'GET',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(r.status===401&&u!=='/api/admin/login'){login();throw new Error(j.error)}if(!r.ok)throw new Error(j.error||'Erro');return j}
function login(err=''){$('#app').innerHTML=`<div class="box"><h3>Entrar</h3>${err?`<p class="err">${esc(err)}</p>`:''}<input class="f" id="pw" type="password" placeholder="Senha do administrador" autocomplete="current-password"><button class="btn red" id="in">ENTRAR</button></div>`;
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#in').click()};$('#in').onclick=async()=>{try{await api('/api/admin/login','POST',{password:$('#pw').value});load()}catch(e){login(e.message)}}}
let filter='',term='';
async function load(){
 let d;try{d=await api('/api/admin/summary')}catch(_){return}
 const s=d.summary,p=d.product;
 $('#app').innerHTML=`${d.missing_config.length?`<div class="warn"><b>Falta configurar:</b> ${d.missing_config.map(esc).join(', ')}</div>`:''}
 <div class="g"><div class="k"><b>${s.total}</b><span>Pedidos</span></div><div class="k"><b>${s.approved}</b><span>Pagamentos aprovados</span></div><div class="k"><b>${s.pending}</b><span>Pagamentos pendentes</span></div><div class="k"><b>${s.delivered}</b><span>Entregas concluídas</span></div><div class="k"><b>${s.delivery_errors}</b><span>Entregas com erro</span></div><div class="k"><b>${brl(s.revenue_cents)}</b><span>Aprovado</span></div></div>
 <div class="box"><h3>Produto</h3><label>Nome</label><input class="f" id="n" value="${esc(p.name)}"><label>Descrição</label><textarea class="f" id="d">${esc(p.description)}</textarea><label>Preço (R$)</label><input class="f" id="pr" inputmode="decimal" value="${(p.price_cents/100).toFixed(2).replace('.',',')}">
 <label>Status</label><select class="f" id="st">${[['DISPONIVEL','DISPONÍVEL'],['INDISPONIVEL','INDISPONÍVEL'],['EM_ATUALIZACAO','EM ATUALIZAÇÃO'],['SEM_ESTOQUE','SEM ESTOQUE']].map(([v,l])=>`<option value="${v}" ${v===p.status?'selected':''}>${l}</option>`).join('')}</select>
 <label>Mensagem de manutenção</label><input class="f" id="mm" value="${esc(p.maintenance_message)}"><button class="btn red" id="sv">SALVAR PRODUTO</button>
 <label style="margin-top:16px">Imagem (qualquer tamanho, ajustada automaticamente)</label><input type="file" id="im" accept="image/*" class="f" style="padding:14px 10px;height:auto"></div>
 <div class="box"><h3>Estoque</h3><p style="color:var(--mut);margin:0 0 10px">Em estoque: <b style="color:#fff">${p.stock}</b> · Reservadas: <b style="color:#fff">${p.reserved}</b></p><input class="f" id="qt" inputmode="numeric" placeholder="Quantidade"><div class="row2"><button class="btn red" data-s="add">ADICIONAR</button><button class="btn ghost" data-s="remove">RETIRAR</button><button class="btn ghost" data-s="set">DEFINIR</button></div></div>
 <div class="box"><h3>Pedidos</h3><div class="tabs">${[['','Todos'],['pending','Pendentes'],['approved','Aprovados'],['delivered','Entregues'],['errors','Com erro']].map(([v,l])=>`<button data-f="${v}" class="${v===filter?'on':''}">${l}</button>`).join('')}</div><input class="f" id="q" inputmode="numeric" placeholder="Buscar por nº do pedido ou UID" value="${esc(term)}"><div id="ol"></div><div id="od"></div></div>
 <div class="row2"><button class="btn ghost" id="lg">VER REGISTROS</button><button class="btn ghost" id="out">SAIR</button></div><div id="logs"></div>`;
 $('#sv').onclick=async()=>{try{await api('/api/admin/product','PUT',{name:$('#n').value,description:$('#d').value,price:$('#pr').value,status:$('#st').value,maintenance_message:$('#mm').value});toast('Produto salvo');load()}catch(e){toast(e.message)}};
 $('#im').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{toast('Enviando imagem...');const bmp=await createImageBitmap(f);const sc=Math.min(1,1400/bmp.width);const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);let url=c.toDataURL('image/webp',.88),mime='image/webp';if(!url.startsWith('data:image/webp')){url=c.toDataURL('image/jpeg',.88);mime='image/jpeg'}await api('/api/admin/product/image','POST',{mime,data:url.split(',')[1]});toast('Imagem atualizada')}catch(x){toast(x.message||'Não foi possível ler essa imagem')}};
 document.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{try{await api('/api/admin/stock','POST',{mode:b.dataset.s,amount:$('#qt').value});toast('Estoque atualizado');load()}catch(e){toast(e.message)}});
 document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;load()});$('#q').onchange=()=>{term=$('#q').value;load()};
 $('#out').onclick=async()=>{await api('/api/admin/logout','POST');login()};
 $('#lg').onclick=async()=>{const l=await api('/api/admin/log');$('#logs').innerHTML=`<div class="box"><h3>Ações do admin</h3>${l.admin.map(a=>`<pre>${new Date(a.created_at).toLocaleString('pt-BR')} · ${esc(a.action)}\n${esc(JSON.stringify(a.details))}</pre>`).join('')||'—'}<h3>Alertas e erros</h3>${l.events.map(a=>`<pre>${new Date(a.created_at).toLocaleString('pt-BR')} · ${esc(a.level)} · ${esc(a.message)}</pre>`).join('')||'—'}</div>`};
 const rows=await api(`/api/admin/orders?filter=${filter}&q=${encodeURIComponent(term)}`);
 $('#ol').innerHTML=rows.map(o=>`<div class="o" data-id="${o.id}"><div><b>#${String(o.id).padStart(6,'0')}</b> · ${esc(o.player_name||'')}<small>UID ${esc(o.uid)} · ${new Date(o.created_at).toLocaleString('pt-BR')}</small></div><div style="text-align:right">${brl(o.amount_cents)}<small>${o.payment_status} / ${o.delivery_status}</small></div></div>`).join('')||'<p style="color:var(--mut)">Nenhum pedido.</p>';
 document.querySelectorAll('.o').forEach(el=>el.onclick=async()=>{const {order:o,attempts}=await api('/api/admin/orders/'+el.dataset.id);
  $('#od').innerHTML=`<div class="box" style="background:var(--card2)"><h3>Pedido #${String(o.id).padStart(6,'0')}</h3><pre>${esc(JSON.stringify(o,null,1))}</pre>${attempts.map(a=>`<pre>Tentativa ${a.ok?'OK':'FALHOU'} (HTTP ${a.http_status??'-'})\n${esc(a.response)}</pre>`).join('')}${o.delivery_status==='ERRO'&&o.payment_status==='APROVADO'?'<button class="btn red" id="rt">REENVIAR ENTREGA (sem nova cobrança)</button><button class="btn ghost" id="rf" style="margin-top:8px">REEMBOLSAR CLIENTE</button>':''}</div>`;
  const rf=$('#rf');if(rf)rf.onclick=async()=>{if(!confirm('Confirme no jogo que o Passe NÃO chegou. O valor total será devolvido ao cliente. Continuar?'))return;try{await api(`/api/admin/orders/${o.id}/refund`,'POST');toast('Reembolso feito');load()}catch(e){toast(e.message)}};
  const rt=$('#rt');if(rt)rt.onclick=async()=>{if(!confirm('Confirme no jogo que o Passe NÃO chegou antes de reenviar. Continuar?'))return;try{const r=await api(`/api/admin/orders/${o.id}/retry-delivery`,'POST');toast('Resultado: '+r.delivery_status);load()}catch(e){toast(e.message)}}});
}
api('/api/admin/summary').then(load).catch(()=>login());
</script></body></html>
